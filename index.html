<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My PyScript App</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>

    <script type="py" defer>
        [config]
        # requirements.txt 대신 사용할 패키지 이름들을 여기에 직접 적어줍니다.
        # 예: packages = ["requests", "beautifulsoup4"] (필요한 패키지가 있다면 추가)
        packages = [] 

        # 실행할 메인 파이썬 스크립트 파일 지정
        src = "./main.py"
    </script>

</body>
</html>
